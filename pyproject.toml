[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-180"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
radio-coordinate = "spectrum.cli:main"
radio-workbench = "spectrum.workbench_cli:main"
radio-arrange = "spectrum.arrange_cli:main"
radio-protection = "spectrum.protection_cli:main"
radio-settle = "spectrum.settle_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
